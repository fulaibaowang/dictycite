# In-text gene detection only (7a/7b labels): alias map from Gene Name + Synonyms — not Gene products.
# Same filters / detect_from as query_expansion_dicty_gene.example.yaml; single expand variant for build_entity_index.
# BM25 expansion uses the full example.yaml; this file is for detect_genes + n_detected_genes / query_expansion_benchmark.

entity_id_col: "GENE ID"

table:
  separator: "\t"

query:
  read_field: "query_text"

expansion_outputs:
  in_text: "_unused"

comma_split_columns:
  - "Synonyms"

product_columns:
  - "Gene products"

ddb_id_pattern: "\\bDDB_G\\d+\\b"

detect_from:
  - "GENE ID"
  - "Gene Name"
  - "Synonyms"

expand_variants:
  in_text:
    expand_with:
      - "Gene Name"
      - "Synonyms"
    exclude_output:
      - "GENE ID"

filters:
  min_alias_len: 4
  max_aliases_per_entity: 3
  auto_block_if_seen_in_n_entities: 5
  blocklist:
    - trna
    - rrna
    - rna
    - dna
    - mrna
    - atp
    - gtp
    - gdp
    - nad
    - nadh
    - nadp
    - nadph
    - fadh
    - coa
    - gef
    - gap
    - kinase
    - phosphatase
    - receptor
    - transporter
    - aldh
    - pks
    - sod
    - plb
    - rnr
    - pp2c
    - putative
    - mitochondrial
    - hypothetical protein
