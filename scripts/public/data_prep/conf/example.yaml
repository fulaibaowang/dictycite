# Query expansion config — generic example
# Copy and adapt for your own entity table and queries.
#
# Usage:
#   python apply_query_expansion.py \
#     --config conf/example.yaml \
#     --table path/to/entities.tsv \
#     --input queries.jsonl \
#     --output queries_expanded.jsonl

# --- Entity table ---
table:
  separator: "\t"           # "\t" for TSV, "," for CSV

entity_id_col: "EntityID"   # column that uniquely identifies each entity

# Columns scanned to build the alias lookup for in-text entity detection.
detect_from:
  - "Name"
  - "Aliases"

# Columns whose values are comma-separated lists of aliases.
comma_split_cols:
  - "Aliases"

# Columns with free-text descriptions (not comma-split).
# Appended whole in expansion variants that include them.
product_cols:
  - "Description"

# Optional: regex to detect bare entity IDs directly in query text.
# Leave empty or omit if your entity IDs don't appear literally in queries.
entity_id_pattern: ""

# --- Query field ---
query:
  read_field: "query"       # field in the input JSONL that holds the query string

# --- Expansion variants ---
# Each variant defines what gets appended to the query and the output field name.
# Expansion is tiered by how many entities are detected:
#   1-2 entities: full expansion (name + filtered aliases from expand_with)
#   3 entities:   light (canonical name only, no synonyms)
#   4+ entities:  minimal (first entity only, name only)
expand_variants:
  names_only:
    output_field: "query_expanded_names"
    expand_with:
      - "Name"
      - "Aliases"
    exclude_from_output:
      - "EntityID"          # never append raw IDs to the query

  names_and_description:
    output_field: "query_expanded_full"
    expand_with:
      - "Name"
      - "Aliases"
      - "Description"
    exclude_from_output:
      - "EntityID"

# --- Alias filters ---
# Applied during index construction; affect both detection and expansion.
filters:
  min_alias_len: 3                      # ignore aliases shorter than this
  max_aliases_per_entity: 3             # cap aliases stored per entity
  auto_block_if_seen_in_n_entities: 5   # block aliases shared across too many entities
  blocklist: []                         # lower-cased exact strings to always exclude