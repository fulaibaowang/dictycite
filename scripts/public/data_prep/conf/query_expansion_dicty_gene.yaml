# Dictyostelium gene expansion — operational config
# Matches notebooks/05_query_expansion_bm25.py defaults.
# Table: dictybase_files/gene_information.txt (TSV, tab-separated)

table:
  separator: "\t"

entity_id_col: "GENE ID"

detect_from:
  - "GENE ID"
  - "Gene Name"
  - "Synonyms"

comma_split_cols:
  - "Synonyms"

query:
  read_field: "query_text"

expand_variants:
  synonyms_only:
    output_field: "query_text_expansion_synonyms"
    expand_with:
      - "Gene Name"
      - "Synonyms"
    exclude_from_output:
      - "GENE ID"

  long:
    output_field: "query_text_synonym_products"
    expand_with:
      - "Gene Name"
      - "Synonyms"
      - "Gene products"
    exclude_from_output:
      - "GENE ID"

filters:
  min_alias_len: 4
  max_aliases_per_entity: 3
  auto_block_if_seen_in_n_entities: 5
  blocklist:
    - trna
    - rrna
    - rna
    - dna
    - mrna
    - atp
    - gtp
    - gdp
    - nad
    - nadh
    - nadp
    - nadph
    - fadh
    - coa
    - gef
    - gap
    - kinase
    - phosphatase
    - receptor
    - transporter
    - aldh
    - pks
    - sod
    - plb
    - rnr
    - pp2c
    - putative
    - mitochondrial
    - hypothetical protein
